<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painting Inspection</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container py-4">

    <h2 class="text-center mb-4">
        Painting Inspection
    </h2>

    <div class="card shadow">

        <div class="card-body">

            <div class="mb-3">

                <label class="form-label">วันที่</label>

                <input type="date"
                       id="date"
                       class="form-control">

            </div>

            <table class="table table-bordered align-middle">

                <thead class="table-primary">

                    <tr>

                        <th>ประเภท</th>

                        <th width="150">จำนวน</th>

                    </tr>

                </thead>

                <tbody>

                    <tr>

                        <td>งานเป็นสนิม</td>

                        <td>
                            <input type="number"
                                   id="rust"
                                   class="form-control"
                                   value="0">
                        </td>

                    </tr>

                    <tr>

                        <td>รอยบุบ</td>

                        <td>

                            <input type="number"
                                   id="dent"
                                   class="form-control"
                                   value="0">

                        </td>

                    </tr>

                    <tr>

                        <td>สะเก็ดรอยเชื่อม</td>

                        <td>

                            <input type="number"
                                   id="weld"
                                   class="form-control"
                                   value="0">

                        </td>

                    </tr>

                    <tr>

                        <td>คราบน้ำยา</td>

                        <td>

                            <input type="number"
                                   id="chemical"
                                   class="form-control"
                                   value="0">

                        </td>

                    </tr>

                    <tr>

                        <td>คราบน้ำมัน</td>

                        <td>

                            <input type="number"
                                   id="oil"
                                   class="form-control"
                                   value="0">

                        </td>

                    </tr>

                </tbody>

            </table>

            <div class="mb-3">

                <label class="form-label">

                    หมายเหตุ

                </label>

                <textarea
                    id="note"
                    class="form-control"
                    rows="3"></textarea>

            </div>

            <button
                class="btn btn-primary w-100"
                onclick="saveData()">

                บันทึกข้อมูล

            </button>

        </div>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>

</body>

</html>
