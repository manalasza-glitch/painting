name: Deploy Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'appscript/**'
      - '.clasp.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Clasp
        run: npm install -g @google/clasp

      - name: Create clasprc.json Credentials
        run: |
          mkdir -p ~/.config/clasp
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Configure Apps Script project
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$APPS_SCRIPT_ID"
          printf '{"scriptId":"%s","rootDir":"./appscript"}\n' "$APPS_SCRIPT_ID" > .clasp.json

      - name: Push and Deploy to Apps Script
        env:
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          test -n "$APPS_SCRIPT_DEPLOYMENT_ID"
          clasp push --force
          clasp deploy --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" --description "Auto-deployed via GitHub Actions"
