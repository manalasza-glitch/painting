name: Deploy Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'appscript/**'
      - '.clasp.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Clasp
        run: npm install -g @google/clasp

      - name: Create clasprc.json Credentials
        run: |
          mkdir -p ~/.config/clasp
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Push and Deploy to Apps Script
        run: |
          clasp push --force || true
          clasp deploy --description "Auto-deployed via GitHub Actions" || true
