name: Deploy Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'appscript/**'
      - '.clasp.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Clasp
        run: npm install -g @google/clasp

      - name: Create clasprc.json Credentials
        run: |
          mkdir -p ~/.config/clasp
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Configure Apps Script project
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          SCRIPT_ID="$APPS_SCRIPT_ID"
          if [ -z "$SCRIPT_ID" ] && [ -f .clasp.json ]; then
            SCRIPT_ID=$(node -e "const fs=require('fs'); const cfg=JSON.parse(fs.readFileSync('.clasp.json','utf8')); process.stdout.write(String(cfg.scriptId || '')); ")
          fi
          test -n "$SCRIPT_ID"
          printf '{"scriptId":"%s","rootDir":"./appscript"}\n' "$SCRIPT_ID" > .clasp.json

      - name: Push and Deploy to Apps Script
        env:
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          # Keep the existing web-app deployment when the repository secret is
          # unavailable. The public web-app URL in js/api.js uses this deployment.
          DEPLOYMENT_ID="$APPS_SCRIPT_DEPLOYMENT_ID"
          if [ -z "$DEPLOYMENT_ID" ]; then
            DEPLOYMENT_ID="AKfycbw-AUsJbDa3oJCKtGmL-tZ5voEPxS3cx9ajPG2ToLEgZgCKTNWzBpgZRTx7ZHDF6g8U"
          fi
          clasp push --force
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "Auto-deployed via GitHub Actions"
